<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="一个无限画布创作工具" />
        <link rel="icon" href="/infinite-canvas/logo.svg" />
        <title>无限画布</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                // 默认 light（与 use-theme-store 的默认值保持一致），只有显式存了 dark 才用暗色。
                var t = s.state && s.state.theme === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
      <script type="module" crossorigin src="/infinite-canvas/assets/index-DdwA7BFo.js"></script>
      <link rel="stylesheet" crossorigin href="/infinite-canvas/assets/index-BGdQ2KqK.css">
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/infinite-canvas/config.js"></script>
    </body>
</html>
